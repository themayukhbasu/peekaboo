[project]
name = "peekaboo"
version = "0.1.0"
description = "Learning-grade inner harness skeleton."
requires-python = ">=3.12"
dependencies = [
    "python-dotenv>=1.2.4",
]

[project.scripts]
peekaboo = "peekaboo.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
