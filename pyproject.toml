[project]
name = "peekaboo"
version = "0.1.0"
description = "Learning-grade inner harness skeleton."
requires-python = ">=3.12"
dependencies = [
    "python-dotenv>=1.2.4",
]

[project.scripts]
peekaboo = "peekaboo.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Ruff is the lint and format gate. It is a dev tool, not a provider SDK
# or an agent framework.
[dependency-groups]
dev = [
    "ruff>=0.17.4",
]

[tool.ruff]
target-version = "py312"
line-length = 88
# Python only. Ruff 0.17's default include also matches Markdown.
include = [
    "*.py",
    "*.pyi",
    "*.ipynb",
    "**/pyproject.toml",
    "**/ruff.toml",
    "**/.ruff.toml",
]

[tool.ruff.lint]
# Pyflakes and pycodestyle errors: undefined names, unused imports, syntax.
# Ruff 0.17's implicit default also includes simplify rules; those stay off.
select = ["E4", "E7", "E9", "F"]
